<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TourGraph Social Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }

        body {
            background: #0a0a0a;
            color: #fafafa;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .badge {
            display: inline-block;
            font-size: 16px;
            font-weight: 700;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.12);
            padding: 8px 18px;
            border-radius: 9999px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h1 {
            font-size: 78px;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.04;
            color: #fafafa;
            margin-top: 32px;
        }

        h1 .accent {
            color: #f59e0b;
        }

        .stats {
            font-size: 26px;
            color: #a0a0a0;
            margin-top: 34px;
            font-weight: 500;
            line-height: 1.5;
            max-width: 940px;
        }

        .stats strong {
            color: #fafafa;
            font-weight: 700;
        }

        .bottom {
            font-size: 19px;
            color: #a0a0a0;
            border-top: 1px solid #2a2a2a;
            padding-top: 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .by .name { color: #fafafa; font-weight: 600; }
        .hub { color: #f59e0b; font-weight: 500; letter-spacing: 0.01em; }
    </style>
</head>
<body>
    <div>
        <span class="badge">TourGraph</span>
        <h1>
            Discover the world's most<br>
            <span class="accent">surprising tours.</span>
        </h1>
        <p class="stats">
            <strong>136,000+ tours</strong> &middot; <strong>3,380 destinations</strong> &middot; No signup, no tracking, no algorithm deciding what you see.
        </p>
    </div>
    <div class="bottom">
        <span class="by">Built by <span class="name">Nikhil Singhal</span></span>
        <span class="hub">nikhilsinghal.com</span>
    </div>
</body>
</html>
